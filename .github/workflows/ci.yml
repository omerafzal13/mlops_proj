name: CI - tests & lint
on:
  pull_request:
    branches: [ dev ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run lint (flake8)
        run: |
          pip install flake8
          flake8 src || true
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q || true
