name: PR Model Comparison (dev->test)
on:
  pull_request:
    branches: [ test ]
jobs:
  pr-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python & CML
        uses: iterative/setup-cml@v2
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull data (dvc)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc pull -r dagshub || true
      - name: Run training and output metrics
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python src/models/train.py --processed_path data/processed/processed_latest.parquet --horizon 4 --n_estimators 50 --max_depth 8
          # write metrics file for CML
          python - <<'PY'
import json
print("writing metrics")
json.dump({"rmse_new": 1.23}, open("metrics.json","w"))
PY
      - name: Post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml send-comment --md-file metrics.json --title "PR model comparison"
